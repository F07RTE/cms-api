name: cms-api

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      # Bootstrap superuser, used only by the init script. The app logs in as cms_writer / cms_reader.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -h 127.0.0.1 -d cms_api_test -U cms_writer
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      # Creates the cms user (guest only accepts loopback connections, which the port mapping
      # isn't) and the cms_api_test vhost, so a running dev consumer never takes test Batches.
      - ./rabbitmq/definitions.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  rabbitmqdata:
