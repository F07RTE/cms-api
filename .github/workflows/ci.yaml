name: CI

on:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet r services:up
      - run: dotnet r test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet r lint:check
      - name: Commit lint
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000*) RANGE="$GITHUB_SHA~1..$GITHUB_SHA" ;; esac
          for sha in $(git rev-list --no-merges "$RANGE"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg"
            dotnet commit-linter "$RUNNER_TEMP/commit-msg"
          done
